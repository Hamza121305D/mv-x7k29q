<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* Money Tracker VIEW copy: read-only. Serves /api/data from the encrypted snapshot and refuses every write. */
(function(){
  const ENC = 'data.enc.json', PASS_KEY = 'mtv_pass';
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  let current = null, meta = null, resolveReady;
  const ready = new Promise(r => { resolveReady = r; });
  async function fetchEnc(){
    const res = await fetch(ENC + '?t=' + Date.now(), {cache: 'no-store'});
    if(!res.ok) throw new Error('snapshot missing');
    return res.json();
  }
  async function decrypt(enc, pass){
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(enc.salt), iterations:enc.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(enc.iv)}, key, b64(enc.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function stamp(){
    const el = document.getElementById('mtv-pill'); if(!el || !meta) return;
    const d = new Date(meta.generated_at), hrs = (Date.now() - d) / 36e5;
    const when = d.toLocaleString([], {weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit'});
    el.textContent = 'View only · synced ' + when;
    el.style.background = hrs > 12 ? 'rgba(245,184,75,.92)' : 'rgba(20,26,35,.88)';
    el.style.color = hrs > 12 ? '#1a1300' : '#A0A9BA';
  }
  async function load(pass){
    const enc = await fetchEnc(); const data = await decrypt(enc, pass);
    current = data; meta = enc; stamp(); return data;
  }
  function askPass(msg){
    return new Promise(resolve => {
      const o = document.createElement('div');
      o.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0B0E13;display:flex;align-items:center;justify-content:center;padding:24px';
      o.innerHTML = '<form style="width:100%;max-width:340px;text-align:center;color:#F5F7FB;font-family:-apple-system,sans-serif">'
        + '<div style="font-size:20px;font-weight:700;margin-bottom:6px">Money Tracker</div>'
        + '<div id="mtv-msg" style="font-size:13px;color:#A0A9BA;margin-bottom:16px">View-only copy. Enter your passphrase.</div>'
        + '<input id="mtv-in" type="password" autocomplete="current-password" style="width:100%;padding:14px;border-radius:12px;border:1px solid #293240;background:#171E28;color:#F5F7FB;font-size:16px;-webkit-user-select:text;user-select:text">'
        + '<button style="width:100%;margin-top:12px;padding:14px;border-radius:12px;background:#4C8DFF;color:#fff;font-size:16px;font-weight:600">Unlock</button></form>';
      document.body.appendChild(o);
      if(msg) o.querySelector('#mtv-msg').textContent = msg;
      o.querySelector('form').onsubmit = ev => { ev.preventDefault(); const v = o.querySelector('#mtv-in').value; o.remove(); resolve(v); };
    });
  }
  async function unlock(){
    let pass = localStorage.getItem(PASS_KEY), msg = '';
    for(;;){
      if(!pass) pass = await askPass(msg);
      try { await load(pass); localStorage.setItem(PASS_KEY, pass); resolveReady(current); return; }
      catch(e){ pass = null; msg = 'That passphrase did not work. Try again.'; localStorage.removeItem(PASS_KEY); }
    }
  }
  const realFetch = window.fetch.bind(window);
  window.fetch = async function(url, opts){
    const path = String(url), method = ((opts && opts.method) || 'GET').toUpperCase();
    if(path === '/api/data' && method === 'GET') return new Response(JSON.stringify(await ready), {status:200, headers:{'Content-Type':'application/json'}});
    if(path.startsWith('/api/') || path.startsWith('/vapid')){
      if(window.showToast) window.showToast('View-only copy: make changes in the live app');
      return new Response('{}', {status:403});
    }
    return realFetch(url, opts);
  };
  document.addEventListener('DOMContentLoaded', () => {
    const pill = document.createElement('div');
    pill.id = 'mtv-pill';
    pill.style.cssText = 'position:fixed;top:calc(env(safe-area-inset-top) + 2px);right:6px;z-index:9998;font:10px -apple-system,sans-serif;padding:2px 8px;border-radius:9px;pointer-events:none;background:rgba(20,26,35,.88);color:#A0A9BA';
    document.body.appendChild(pill);
    unlock();
  });
  document.addEventListener('visibilitychange', async () => {  // reopening the app picks up a newer snapshot
    if(document.visibilityState !== 'visible' || !current) return;
    try { await load(localStorage.getItem(PASS_KEY)); if(window.refresh) await window.refresh(); } catch(e){}
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Money View</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Money View">
<meta name="theme-color" content="#0B0E13">
<style>
:root{
  --bg:#0B0E13; --bg2:#10151D; --card:#141A23; --elevated:#18202B; --input:#171E28;
  --border:#293240; --border-subtle:rgba(140,155,180,0.18);
  --text:#F5F7FB; --text2:#A0A9BA; --text3:#727D91;
  --blue:#4C8DFF; --blue-pressed:#3777E5;
  --positive:#3DDC97; --negative:#FF6673; --warning:#F5B84B; --orange:#FF8A3D;
  --cat-food:#FF922E; --cat-transport:#378BFF; --cat-shopping:#9747FF;
  --cat-rent:#39C98A; --cat-subscriptions:#FF5F6D; --cat-other:#8B97AA;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);height:100%;overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;}
body{padding-top:env(safe-area-inset-top);-webkit-user-select:none;user-select:none;}
button,input,select,textarea{font-family:inherit;}
button{background:none;border:none;margin:0;padding:0;color:inherit;font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;}
.icon{display:block;flex-shrink:0;}
.app{max-width:520px;margin:0 auto;position:relative;}

/* ---- header ---- */
header{padding:14px 18px 0;}
.hd-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.hd-text{flex:1;min-width:0;}
.hd-title{font-size:23px;font-weight:700;line-height:1.15;letter-spacing:-.01em;white-space:nowrap;}
.hd-sub{font-size:12px;color:var(--text2);margin-top:1px;font-weight:400;}
.hd-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.bell-wrap{position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--text);}
.bell-dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--negative);border:2px solid var(--bg);}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--elevated);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;border:1px solid var(--border-subtle);flex-shrink:0;}

/* ---- month selector ---- */
.month-row{display:flex;gap:6px;padding:8px 18px 0;}
.month-main{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border-subtle);border-radius:14px;padding:0 12px;height:44px;color:var(--text);}
.month-main .label{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.month-nav{display:flex;background:var(--card);border:1px solid var(--border-subtle);border-radius:14px;height:44px;overflow:hidden;}
.month-nav button{width:34px;background:transparent;border:none;color:var(--text2);display:flex;align-items:center;justify-content:center;}
.month-nav button:active{background:var(--elevated);color:var(--text);}

main{padding:10px 18px 84px;}
.view{display:none;}
.view.active{display:block;}

/* ---- summary cards ---- */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:8px;}
.sum-card{background:var(--card);border:1px solid var(--border-subtle);border-radius:16px;padding:12px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.18);}
.sum-card:active{transform:scale(.98);}
.icon-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.sum-label{color:var(--text2);font-size:11px;margin-top:8px;}
.sum-value{font-size:17px;font-weight:700;margin-top:2px;}
.sum-delta{font-size:10px;color:var(--text3);margin-top:2px;}
.up{color:var(--positive);} .down{color:var(--negative);}

/* ---- cards / sections ---- */
.card{background:var(--card);border:1px solid var(--border-subtle);border-radius:16px;padding:12px;margin-top:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.card-title{font-size:14px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.see-all{color:var(--blue);font-size:11px;font-weight:600;background:none;border:none;padding:3px 5px;margin:-3px -5px;border-radius:8px;flex-shrink:0;}
.see-all:active{background:rgba(76,141,255,.12);opacity:.8;}

/* two-col row of cards */
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:start;}
.row2 .card{padding:10px;}
.row2 .card-title{font-size:12px;}
.row2 .card{margin-top:8px;}

/* donut */
.donut-wrap{display:flex;gap:10px;align-items:center;}
.donut-svg{flex-shrink:0;}
.donut-center{font-size:0;}
.legend{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;max-height:112px;overflow-y:auto;}
.legend-row{display:flex;align-items:center;gap:6px;font-size:11px;}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.legend-icon{width:16px;height:16px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.legend-name{color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.legend-amt{color:var(--text);font-weight:600;white-space:nowrap;}
.legend-pct{color:var(--text3);width:28px;text-align:right;flex-shrink:0;}

/* scrollable list boxes: keep the card compact and let its content scroll internally */
.scroll-box{max-height:230px;overflow-y:auto;}
.scroll-box>*,.home-scroll>*{flex-shrink:0;}
/* Home bills / transactions: about four rows visible, swipe inside to reach the rest */
.home-scroll{max-height:210px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}

/* progress bars */
.progress-track{height:6px;border-radius:99px;background:#242D3A;overflow:hidden;margin-top:6px;}
.progress-fill{height:100%;border-radius:99px;transition:width .3s ease;}
.progress-row{display:flex;align-items:center;gap:8px;}
.progress-row .progress-track{flex:1;margin-top:0;}
.progress-pct{font-size:10px;color:var(--text2);width:30px;text-align:right;}
.budget-figure{font-size:15px;font-weight:700;}
.budget-figure span{font-size:11px;font-weight:400;color:var(--text2);}

/* list rows (bills / transactions) */
.list{display:flex;flex-direction:column;gap:8px;}
.row-item{display:flex;align-items:center;gap:8px;}
.row-badge{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;color:#fff;}
.row-body{flex:1;min-width:0;}
.row-title{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-sub{font-size:10px;color:var(--text3);margin-top:1px;}
.row-amt{font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0;}
.row-actions{display:flex;gap:5px;flex-shrink:0;}
.icon-btn{width:26px;height:26px;border-radius:8px;background:var(--elevated);border:1px solid var(--border-subtle);color:var(--text2);display:flex;align-items:center;justify-content:center;}
.icon-btn:active{background:var(--input);}
.summary-line{display:flex;align-items:center;gap:6px;color:var(--text2);font-size:11px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-subtle);}
.summary-line .icon{color:var(--text3);}
.summary-line .chev{margin-left:auto;color:var(--text3);}

.empty{color:var(--text3);font-size:11px;text-align:center;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.empty .icon{color:var(--text3);}
.empty .btn.small{margin-top:2px;}

/* fab */
.fab-wrap{position:fixed;inset:0;max-width:520px;margin:0 auto;pointer-events:none;z-index:20;}
.fab{position:absolute;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));width:50px;height:50px;border-radius:50%;
  background:var(--blue);color:#fff;box-shadow:0 8px 24px rgba(76,141,255,.30);display:flex;align-items:center;justify-content:center;pointer-events:auto;}
.fab:active{transform:scale(.95);}

/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--border-subtle);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:15;}
.app nav.bottom{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:520px;}
.nav-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;color:var(--text3);border:none;background:none;}
.nav-item.active{color:var(--blue);}
.nav-item span{font-size:9.5px;font-weight:500;text-align:center;line-height:1.1;}

/* filter pills */
.pill-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none;}
.pill-row::-webkit-scrollbar{display:none;}
.pill{flex-shrink:0;padding:7px 13px;border-radius:99px;font-size:11px;font-weight:600;background:var(--card);border:1px solid var(--border-subtle);color:var(--text2);white-space:nowrap;}
.pill.active{background:var(--blue);color:#fff;border-color:var(--blue);}

.search-wrap{position:relative;margin-top:10px;}
.search-wrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);}
.search-input{width:100%;height:42px;border-radius:14px;background:var(--input);border:1px solid var(--border-subtle);color:var(--text);padding:0 14px 0 40px;font-size:13px;}
.search-input::placeholder{color:var(--text3);}
.bar-col{cursor:pointer;}
.bar-col.sel .bar-label{color:#fff;font-weight:700;}
.bar-net{font-size:9px;font-weight:600;display:block;text-align:center;}
.bars-detail{margin-top:12px;font-size:12px;color:var(--text2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.chart-note{font-size:11px;color:var(--text3);margin-top:6px;}
.chg{font-size:11px;font-weight:700;margin-right:8px;white-space:nowrap;}
.wk-bars{display:flex;gap:8px;align-items:flex-end;height:130px;margin-top:14px;}
.wk-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.wk-bar{width:100%;border-radius:8px 8px 3px 3px;background:#3A4A63;min-height:3px;}
.wk-col.top .wk-bar{background:var(--blue);}
.wk-val{font-size:9px;color:var(--text2);margin-bottom:3px;white-space:nowrap;}
.wk-lab{font-size:11px;color:var(--text3);margin-top:6px;}
.split-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin-top:12px;background:#242D3A;}
.merch-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-subtle);}
.merch-row:last-child{border-bottom:none;}
.progress-track{position:relative;}
.pace-tick{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.9;}
.status-chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
.stat{background:var(--input);border:1px solid var(--border-subtle);border-radius:14px;padding:10px 12px;}
.stat-label{font-size:11px;color:var(--text2);}
.stat-value{font-size:16px;font-weight:700;margin-top:2px;}
.search-row{display:flex;gap:8px;align-items:center;margin-top:10px;}
.search-row .search-wrap{flex:1;margin-top:0;}
.filter-btn{position:relative;width:46px;height:42px;flex-shrink:0;border-radius:14px;background:var(--input);border:1px solid var(--border-subtle);color:var(--text2);display:flex;align-items:center;justify-content:center;}
.filter-btn.on{color:#fff;background:var(--blue);border-color:var(--blue);}
.filter-badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--negative);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.type-seg{display:flex;gap:8px;margin-top:12px;}
.type-seg button{flex:1;height:44px;border-radius:14px;font-size:14px;font-weight:600;background:var(--card);border:1px solid var(--border-subtle);color:var(--text2);}
.type-seg button.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:var(--card);border:1px solid var(--blue);color:var(--text);font-size:12px;font-weight:600;}
.tag .icon{color:var(--text3);}
.summary-strip{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--text2);}
.filter-note{font-size:11px;color:var(--text3);margin-top:6px;}
.range-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.range-chip{padding:9px 14px;border-radius:99px;font-size:13px;font-weight:600;background:var(--input);border:1px solid var(--border-subtle);color:var(--text2);}
.range-chip.active{background:var(--blue);color:#fff;border-color:var(--blue);}

.section-label{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:16px 2px 8px;}

/* sheets / modals */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:40;}
.backdrop.open{display:flex;}
.sheet{width:100%;max-width:520px;background:var(--elevated);border-radius:26px 26px 0 0;padding:20px 20px calc(26px + env(safe-area-inset-bottom));
  max-height:86vh;overflow-y:auto;animation:sheetUp .28s cubic-bezier(.2,.9,.3,1);}
@keyframes sheetUp{from{transform:translateY(30px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:36px;height:4px;border-radius:99px;background:var(--border);margin:0 auto 14px;}
.sheet h2{margin:0 0 16px;font-size:19px;font-weight:700;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:500;}
.field input,.field select,.field textarea{width:100%;padding:14px;border-radius:16px;border:1px solid var(--border);background:var(--input);color:var(--text);font-size:16px;}
.field textarea{resize:none;min-height:70px;}
.amount-field input{font-size:32px;font-weight:700;padding:16px 14px;text-align:center;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--input);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:14px;}
.toggle-row .toggle-label{font-size:15px;}
.switch{width:46px;height:28px;border-radius:99px;background:var(--border);position:relative;border:none;flex-shrink:0;}
.switch.on{background:var(--blue);}
.switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .18s ease;}
.switch.on .knob{transform:translateX(18px);}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:9px 14px;border-radius:12px;background:var(--input);border:1px solid var(--border);color:var(--text2);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;}
.chip.active{background:rgba(76,141,255,.16);border-color:var(--blue);color:var(--blue);}
.color-row{display:flex;flex-wrap:wrap;gap:10px;}
.color-dot{width:32px;height:32px;border-radius:50%;border:2px solid transparent;}
.color-dot.active{border-color:#fff;}
.sheet-actions{display:flex;gap:10px;margin-top:6px;}
.btn{border:none;border-radius:16px;padding:16px;font-size:15px;font-weight:600;background:var(--input);color:var(--text);flex:1;text-align:center;border:1px solid var(--border);}
.btn.primary{background:var(--blue);color:#fff;border:none;}
.btn.primary:active{background:var(--blue-pressed);}
.btn.danger{background:transparent;color:var(--negative);border:1px solid var(--negative);}
.btn.small{flex:none;padding:10px 16px;font-size:13px;}
.action-list{display:flex;flex-direction:column;gap:10px;}
.action-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--input);border:1px solid var(--border);}
.action-item .icon-circle{width:42px;height:42px;}

/* settings */
.settings-group{background:var(--card);border:1px solid var(--border-subtle);border-radius:20px;overflow:hidden;margin-top:16px;}
.settings-row{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--border-subtle);}
.settings-row:last-child{border-bottom:none;}
.settings-row .icon-circle{width:38px;height:38px;}
.settings-row .label{flex:1;font-size:15px;}
.settings-row .value{color:var(--text3);font-size:14px;}
.settings-title{font-size:13px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:20px 4px 8px;}
.profile-row{display:flex;align-items:center;gap:14px;padding:6px 2px 16px;}
.profile-row .avatar{width:64px;height:64px;font-size:24px;}
.tag-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.tag{display:flex;align-items:center;gap:8px;background:var(--input);border:1px solid var(--border);border-radius:12px;padding:8px 10px 8px 12px;font-size:13px;}
.tag button{background:none;border:none;color:var(--text3);display:flex;}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--elevated);border:1px solid var(--border);color:var(--text);padding:12px 18px;border-radius:14px;font-size:14px;
  display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:all .25s ease;z-index:60;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast button{background:none;border:none;color:var(--blue);font-weight:700;font-size:14px;}

/* analytics bars */
.bars{display:flex;align-items:flex-end;gap:14px;height:120px;margin-top:16px;padding:0 4px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.bar-pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center;}
.bar{width:10px;border-radius:4px 4px 0 0;min-height:3px;}
.bar-label{font-size:11px;color:var(--text3);}
.insight{background:rgba(76,141,255,.08);border:1px solid rgba(76,141,255,.25);border-radius:14px;padding:11px 13px;font-size:12px;color:var(--text);margin-top:10px;display:flex;gap:8px;align-items:flex-start;}
.insight .icon{color:var(--blue);margin-top:1px;}
.trend-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:12px;border-bottom:1px solid var(--border-subtle);}
.trend-row:last-child{border-bottom:none;}
</style>

<script>
/* ---------------- icons ---------------- */
const ICON_PATHS = {

  wifi:'<path d="M2 8.5a16 16 0 0 1 20 0"/><path d="M5 12.5a11 11 0 0 1 14 0"/><path d="M8.5 16.5a6 6 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1.3" fill="currentColor" stroke="none"/>',

  download:'<path d="M12 3v13M6 11l6 6 6-6"/><path d="M4 20h16"/>',
  upload:'<path d="M12 20V7M6 12l6-6 6 6"/><path d="M4 20h16"/>',
  chevronRight:'<path d="M9 6l6 6-6 6"/>',
  bag:'<path d="M8 4h8l3 6H5l3-6z"/><path d="M4 10h16l-1.4 9.2A2 2 0 0 1 16.6 21H7.4a2 2 0 0 1-2-1.8L4 10z"/><path d="M11.3 13v4M9 15h4.6"/>',
  plusCircle:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>'
};
function icon(name, size=20, color='currentColor', stroke=2){
  return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name]||''}</svg>`;
}
function hexToRgba(hex, a){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
const CAT_ICON = {food:'food', transport:'transport', shopping:'shopping', rent:'house', subscriptions:'gamepad', other:'other'};

/* ---------------- state ---------------- */
let DATA = null;
let selMonth = new Date();
let activeTab = 'home';
const TXADV_DEFAULT = {range:'month', from:'', to:'', min:'', max:'', category:'', account:'', sort:'new'};
const TXF_KEY = 'mt_history_filters';
let txAdv = {...TXADV_DEFAULT};
let txFilter = 'all';
try{ const saved = JSON.parse(localStorage.getItem(TXF_KEY)||'{}'); txAdv = {...TXADV_DEFAULT, ...(saved.adv||{})}; if(['all','expenses','income','bills'].includes(saved.type)) txFilter = saved.type; }catch(e){}
function saveTxFilters(){ try{ localStorage.setItem(TXF_KEY, JSON.stringify({type:txFilter, adv:txAdv})); }catch(e){} }
let txSearch = '';
let selectedDonutCat = null;
let analyticsPeriod = 'month';

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function monthKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function inSelMonth(dateStr){ return (dateStr||'').slice(0,7) === monthKey(selMonth); }
function fmt(n){
  const cur = DATA.settings.currency || '$';
  const sign = n<0 ? '-' : '';
  return sign + cur + Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }  // local date, not UTC (Morocco is UTC+1: UTC made the first hour after midnight count as yesterday)
function daysUntil(d){ return Math.ceil((new Date(d+'T00:00:00') - new Date(todayISO()+'T00:00:00'))/86400000); }
function catById(id){ return DATA.settings.categories.find(c=>c.id===id) || {id:'other',name:'Other',color:'var(--cat-other)',icon:'other'}; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

/* ---------------- api ---------------- */
async function api(method, path, body){
  const opts = {method};
  if(body!==undefined){ opts.headers={'Content-Type':'application/json'}; opts.body=JSON.stringify(body); }
  const res = await fetch(path, opts);
  if(!res.ok) throw new Error('request failed');
  return res.status===204 ? null : res.json();
}
async function loadData(){
  DATA = await api('GET','/api/data');
}
async function refresh(){
  await loadData();
  renderHeader();
  renderCurrentTab();
}

/* ---------------- toast ---------------- */
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  document.getElementById('toast-undo').style.display='none';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), 3200);
}

/* ---------------- receipt viewer ---------------- */
function showReceipt(dataUrl){
  let ov = document.getElementById('receipt-overlay');
  if(!ov){
    ov = document.createElement('div');
    ov.id = 'receipt-overlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;';
    ov.innerHTML = '<img id="receipt-overlay-img" style="max-width:100%;max-height:100%;border-radius:14px;">';
    ov.onclick = ()=> ov.remove();
    document.body.appendChild(ov);
  }
  document.getElementById('receipt-overlay-img').src = dataUrl;
}

/* ---------------- sheet system ---------------- */
const backdrop = document.getElementById('backdrop');
const sheetBody = document.getElementById('sheet-body');
function openSheet(html){
  sheetBody.innerHTML = html;
  backdrop.classList.add('open');
}
function closeSheet(){ backdrop.classList.remove('open'); sheetBody.innerHTML=''; }
backdrop.addEventListener('click', e=>{ if(e.target===backdrop) closeSheet(); });

/* ---------------- header / month ---------------- */
function renderHeader(){
  document.getElementById('avatar-btn').textContent = initials(DATA.settings.profile_name);
  document.getElementById('month-label').textContent = `${MONTH_NAMES[selMonth.getMonth()]} ${selMonth.getFullYear()}`;
}
document.getElementById('month-prev').onclick = ()=>{ selMonth = new Date(selMonth.getFullYear(), selMonth.getMonth()-1, 1); renderHeader(); renderCurrentTab(); };
document.getElementById('month-next').onclick = ()=>{ selMonth = new Date(selMonth.getFullYear(), selMonth.getMonth()+1, 1); renderHeader(); renderCurrentTab(); };
document.getElementById('month-main').onclick = openMonthPicker;

function openMonthPicker(){
  const y = selMonth.getFullYear();
  const months = MONTH_NAMES.map((m,i)=>`<button class="chip ${i===selMonth.getMonth()?'active':''}" data-m="${i}">${m.slice(0,3)}</button>`).join('');
  openSheet(`
    <h2>Select month</h2>
    <div class="field-row" style="align-items:center;margin-bottom:14px;">
      <button class="icon-btn" id="yr-prev">${icon('chevronRight',16,'currentColor',2).replace('m6 6l6','')}${icon('sliders',0)}</button>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:16px;">
      <button class="icon-btn" id="yr-prev2">‹</button>
      <div style="font-size:18px;font-weight:700;">${y}</div>
      <button class="icon-btn" id="yr-next2">›</button>
    </div>
    <div class="chip-row" id="month-chips">${months}</div>
    <div class="sheet-actions"><button class="btn" id="sheet-cancel">Close</button></div>
  `);
  let tmpY = y;
  const yrLabel = ()=>sheetBody.querySelector('div[style*="font-size:18px"]').textContent = tmpY;
  sheetBody.querySelector('#yr-prev2').onclick = ()=>{ tmpY--; yrLabel(); };
  sheetBody.querySelector('#yr-next2').onclick = ()=>{ tmpY++; yrLabel(); };
  sheetBody.querySelectorAll('[data-m]').forEach(b=>{
    b.onclick = ()=>{ selMonth = new Date(tmpY, parseInt(b.dataset.m), 1); renderHeader(); renderCurrentTab(); closeSheet(); };
  });
  sheetBody.querySelector('#sheet-cancel').onclick = closeSheet;
  sheetBody.querySelector('#yr-prev').closest('.field-row').remove();
}

/* ---------------- computed aggregates ---------------- */
function monthExpenses(){ return DATA.expenses.filter(e=>inSelMonth(e.date)); }
function monthIncome(){ return DATA.income.filter(i=>inSelMonth(i.date)); }
function prevMonthExpenses(){
  const p = new Date(selMonth.getFullYear(), selMonth.getMonth()-1, 1);
  return DATA.expenses.filter(e=>(e.date||'').slice(0,7)===monthKey(p));
}
function prevMonthIncome(){
  const p = new Date(selMonth.getFullYear(), selMonth.getMonth()-1, 1);
  return DATA.income.filter(i=>(i.date||'').slice(0,7)===monthKey(p));
}
function sum(list){ return list.reduce((s,x)=>s+(x.amount||0),0); }
function pctChange(cur, prev){ if(!prev) return cur? 100 : 0; return ((cur-prev)/prev)*100; }
function categoryTotals(list){
  const map = {};
  list.forEach(e=>{ map[e.category]=(map[e.category]||0)+e.amount; });
  return DATA.settings.categories
    .map(c=>({cat:c, amount: map[c.id]||0}))
    .filter(x=>x.amount>0)
    .sort((a,b)=>b.amount-a.amount);
}
function upcomingBills(){
  return DATA.bills.filter(b=>!b.paid).sort((a,b)=>a.due_date.localeCompare(b.due_date));
}
function budgetColor(pct){
  if(pct>=100) return 'var(--negative)';
  if(pct>=90) return 'var(--orange)';
  if(pct>=70) return 'var(--warning)';
  return 'var(--positive)';
}

/* ---------------- donut ---------------- */
function donutSvg(totals, total, size=104, stroke=17){
  const r = (size-stroke)/2, c = size/2, circ = 2*Math.PI*r;
  let acc = 0;
  const segs = totals.map(t=>{
    const frac = total? t.amount/total : 0;
    const len = frac*circ;
    const seg = `<circle data-cat="${t.cat.id}" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${t.cat.color}" stroke-width="${stroke}" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-acc}" class="donut-seg" style="cursor:pointer;"/>`;
    acc += len;
    return seg;
  }).join('');
  return `<svg class="donut-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <g transform="rotate(-90 ${c} ${c})">
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#1C2430" stroke-width="${stroke}"/>
      ${segs}
    </g>
    <text x="${c}" y="${c-3}" text-anchor="middle" fill="var(--text)" font-size="14" font-weight="700" id="donut-center-amt">${fmt(total)}</text>
    <text x="${c}" y="${c+11}" text-anchor="middle" fill="var(--text3)" font-size="8.5" id="donut-center-label">Total Spent</text>
  </svg>`;
}

/* Money put into savings goals that month (removals count negative). A goal's opening balance, the part
   never logged as a dated contribution, belongs to the month the goal was created. */
function goalSavedInMonth(key){
  return (DATA.savings_goals||[]).reduce((t,g)=>{
    const logged = g.contributions||[];
    let s = logged.filter(c=>(c.date||'').slice(0,7)===key).reduce((a,c)=>a+(c.amount||0),0);
    if((g.created_at||'').slice(0,7)===key) s += (g.current||0) - logged.reduce((a,c)=>a+(c.amount||0),0);
    return t+s;
  },0);
}

/* ---------------- HOME ---------------- */
function renderHome(){
  const el = document.getElementById('view-home');
  const inc = sum(monthIncome());
  const exp = sum(monthExpenses());
  const net = inc - exp - goalSavedInMonth(monthKey(selMonth));
  const prevInc = sum(prevMonthIncome());
  const prevExp = sum(prevMonthExpenses());
  const incDelta = pctChange(inc, prevInc);
  const expDelta = pctChange(exp, prevExp);
  const bills = upcomingBills();
  const due7 = bills.filter(b=>daysUntil(b.due_date)<=7 && daysUntil(b.due_date)>=0);
  // Home lists unpaid bills due in the selected month, plus unpaid overdue ones from EARLIER months
  // (an unpaid September bill still shows in October next to October's own). Never months early.
  const homeBills = bills.filter(b=>inSelMonth(b.due_date) || (daysUntil(b.due_date)<0 && b.due_date.slice(0,7) < monthKey(selMonth)));
  const homeBillsTotal = sum(homeBills);

const ICON_NOISE = new Set(['bill','bills','payment','payments','subscription','monthly','plan','premium','membership','fee','fees','invoice','recharge','the']);
function normName(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').split(' ').filter(w=>w && !ICON_NOISE.has(w)).join(' '); }
function brandIcon(name){ const k = normName(name); return k && DATA.brand_icons ? DATA.brand_icons[k] : undefined; }
function iconImgBadge(src){ return `<div class="row-badge" style="padding:0;overflow:hidden;background:none"><img src="${src}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>`; }
function billBadge(b){
  const found = b.icon || brandIcon(b.name);
  if(found) return iconImgBadge(found);
  const name=(b.name||'').toLowerCase();
  if(name.includes('netflix')) return `<div class="row-badge" style="background:#141414;color:#E50914">N</div>`;
  if(name.includes('internet')||name.includes('wifi')) return `<div class="row-badge" style="background:#1E2A38;color:#8FB8E8">${icon('wifi',15,'#8FB8E8',2)}</div>`;
  const c = catById(b.category);
  if(c.id==='rent') return `<div class="row-badge" style="background:#132B22;color:#39C98A">${icon('house',15,'#39C98A',2)}</div>`;
  return `<div class="row-badge" style="background:${hexToRgba(c.color,.18)};color:${c.color}">${icon(CAT_ICON[c.icon]||'other',15,c.color,2)}</div>`;
}
function shortDate(dateStr){
  const dt = new Date(dateStr+'T00:00:00');
  return `${MONTH_NAMES[dt.getMonth()].slice(0,3)} ${dt.getDate()}, ${dt.getFullYear()}`;
}
function billRow(b){
  const days = daysUntil(b.due_date);
  let status = days<0 ? 'Overdue' : days===0 ? 'Due today' : shortDate(b.due_date);
  return `<div class="row-item" data-bill="${b.id}" style="cursor:pointer;">
    ${billBadge(b)}
    <div class="row-body"><div class="row-title">${escapeHtml(b.name)}</div><div class="row-sub">${status}</div></div>
    <div class="row-amt" style="color:var(--negative)">${fmt(b.amount)}</div>
  </div>`;
}
function merchantBadge(merchant, kind, category, iconSrc){
  const m = (merchant||'').toLowerCase();
  if(!iconSrc) iconSrc = brandIcon(merchant);
  if(iconSrc) return `<div class="row-badge" style="padding:0;overflow:hidden;background:none"><img src="${iconSrc}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>`;
  const known = {
    starbucks:{bg:'#0C3B2E',fg:'#1DB477',letter:'S'},
    uber:{bg:'#000000',fg:'#fff',letter:'U'},
    carrefour:{bg:'#fff',fg:'#0057A8',letter:'C'},
  };
  if(kind==='income') return `<div class="row-badge" style="background:#12321F;color:#3DDC97">${icon('bag',15,'#3DDC97',2)}</div>`;
  for(const k in known){ if(m.includes(k)){ const s=known[k]; return `<div class="row-badge" style="background:${s.bg};color:${s.fg};border:1px solid var(--border-subtle)">${s.letter}</div>`; } }
  const c = catById(category);
  return `<div class="row-badge" style="background:${hexToRgba(c.color,.18)};color:${c.color}">${icon(CAT_ICON[c.icon]||'other',15,c.color,2)}</div>`;
}
function txRow(t){
  const isIncome = t.kind==='income';
  const label = isIncome ? (t.source||'Income') : (t.merchant||'Expense');
  const hasReceipt = !isIncome && t.receipt;
  return `<div class="row-item" data-tx="${t.id}" data-tx-kind="${t.kind}" style="cursor:pointer;">
    <div style="position:relative;flex-shrink:0;">
      ${merchantBadge(label, t.kind, t.category, t.icon)}
      ${hasReceipt ? `<button class="icon-btn" data-view-receipt="${t.id}" style="position:absolute;right:-6px;bottom:-6px;width:18px;height:18px;border-radius:50%;">${icon('paperclip',10)}</button>` : ''}
    </div>
    <div class="row-body"><div class="row-title">${escapeHtml(label)}</div><div class="row-sub">${shortDate(t.date)}</div></div>
    <div class="row-amt" style="color:${isIncome?'var(--positive)':'var(--negative)'}">${isIncome?'+':'-'}${fmt(Math.abs(t.amount))}</div>
  </div>`;
}

/* ---------------- TRANSACTIONS ---------------- */
function allTransactionsList(){
  const exp = DATA.expenses.map(e=>({...e,kind:'expense'}));
  const inc = DATA.income.map(i=>({...i,kind:'income'}));
  const bil = DATA.bills.map(b=>({...b,kind:'bill',date:b.due_date}));
  return [...exp,...inc,...bil];
}
function groupLabel(dateStr){
  const d = dateStr, today = todayISO();
  const yest = isoAddDays(todayISO(), -1);
  if(d===today) return 'Today';
  if(d===yest) return 'Yesterday';
  const dt = new Date(d+'T00:00:00');
  return `${MONTH_NAMES[dt.getMonth()]} ${dt.getDate()}${dt.getFullYear()!==new Date().getFullYear() ? ', '+dt.getFullYear() : ''}`;
}
function isoAddDays(iso, n){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function txRangeMatch(ds){
  if(!ds) return false;
  const r = txAdv.range, t = todayISO();
  if(r==='all') return true;
  if(r==='7d') return ds>=isoAddDays(t,-6) && ds<=t;
  if(r==='30d') return ds>=isoAddDays(t,-29) && ds<=t;
  if(r==='year') return ds.slice(0,4)===t.slice(0,4);
  if(r==='custom') return (!txAdv.from || ds>=txAdv.from) && (!txAdv.to || ds<=txAdv.to);
  return inSelMonth(ds);
}
const TX_RANGE_LABEL = {'7d':'Last 7 days','30d':'Last 30 days',year:'This year',all:'All time'};
function txActiveTags(){
  const tags = [];
  if(txAdv.range!=='month'){
    let label = TX_RANGE_LABEL[txAdv.range];
    if(txAdv.range==='custom') label = txAdv.from && txAdv.to ? `${shortDate(txAdv.from)} – ${shortDate(txAdv.to)}` : txAdv.from ? `From ${shortDate(txAdv.from)}` : `Until ${shortDate(txAdv.to)}`;
    tags.push({key:'range', label});
  }
  if(txAdv.min!=='' && txAdv.max!=='') tags.push({key:'amount', label:`${fmt(+txAdv.min)} – ${fmt(+txAdv.max)}`});
  else if(txAdv.min!=='') tags.push({key:'amount', label:`Min ${fmt(+txAdv.min)}`});
  else if(txAdv.max!=='') tags.push({key:'amount', label:`Max ${fmt(+txAdv.max)}`});
  if(txAdv.category) tags.push({key:'category', label:catById(txAdv.category).name});
  if(txAdv.account) tags.push({key:'account', label:txAdv.account});
  if(txAdv.sort!=='new') tags.push({key:'sort', label:{old:'Oldest first', high:'Biggest amount', low:'Smallest amount'}[txAdv.sort]});
  return tags;
}
function txClearTag(key){
  if(key==='range'){ txAdv.range='month'; txAdv.from=''; txAdv.to=''; }
  else if(key==='amount'){ txAdv.min=''; txAdv.max=''; }
  else txAdv[key] = TXADV_DEFAULT[key];
}
function renderTransactions(){
  const el = document.getElementById('view-transactions');
  let list = allTransactionsList().filter(t=>txRangeMatch(t.kind==='bill' ? t.due_date : t.date));
  if(txFilter==='expenses') list = list.filter(t=>t.kind==='expense');
  else if(txFilter==='income') list = list.filter(t=>t.kind==='income');
  else if(txFilter==='bills') list = list.filter(t=>t.kind==='bill');
  if(txSearch.trim()){
    const q = txSearch.toLowerCase();
    list = list.filter(t=>(t.merchant||t.source||t.name||'').toLowerCase().includes(q));
  }
  if(txAdv.min!=='') list = list.filter(t=>Math.abs(t.amount||0) >= +txAdv.min);
  if(txAdv.max!=='') list = list.filter(t=>Math.abs(t.amount||0) <= +txAdv.max);
  if(txAdv.category) list = list.filter(t=>t.category===txAdv.category);
  if(txAdv.account) list = list.filter(t=>t.account===txAdv.account);
  const dateOf = t=> (t.kind==='bill' ? t.due_date : t.date) || '';
  const bySort = {
    new:(a,b)=> dateOf(b).localeCompare(dateOf(a)),
    old:(a,b)=> dateOf(a).localeCompare(dateOf(b)),
    high:(a,b)=> Math.abs(b.amount||0) - Math.abs(a.amount||0),
    low:(a,b)=> Math.abs(a.amount||0) - Math.abs(b.amount||0),
  };
  list.sort(bySort[txAdv.sort] || bySort.new);
  const groups = {};
  list.forEach(t=>{ const g = (txAdv.sort==='high'||txAdv.sort==='low') ? 'By amount' : groupLabel(dateOf(t)); (groups[g] = groups[g]||[]).push(t); });
  const tags = txActiveTags();
  const spent = sum(list.filter(t=>t.kind==='expense')), earned = sum(list.filter(t=>t.kind==='income'));

  el.innerHTML = `
    <div class="search-row">
      <div class="search-wrap">${icon('search',15)}<input class="search-input" id="tx-search" placeholder="Search history" value="${escapeHtml(txSearch)}"></div>
      <button class="filter-btn ${tags.length?'on':''}" id="tx-filter-btn" aria-label="Filters">${icon('sliders',18)}${tags.length?`<span class="filter-badge">${tags.length}</span>`:''}</button>
    </div>
    <div class="type-seg">
      ${['all','expenses','income','bills'].map(f=>`<button class="${txFilter===f?'active':''}" data-filter="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}
    </div>
    ${tags.length ? `<div class="tags-row">${tags.map(t=>`<span class="tag">${escapeHtml(t.label)}<button data-clear-tag="${t.key}" aria-label="Remove" style="background:none;border:none;padding:0;display:flex;color:inherit;">${icon('x',12)}</button></span>`).join('')}</div>` : ''}
    ${txAdv.range!=='month' ? `<div class="filter-note">This date range replaces the month picker.</div>` : ''}
    <div class="summary-strip"><span>${list.length} result${list.length===1?'':'s'}</span><span>${spent?`Spent <b style="color:var(--negative)">${fmt(spent)}</b>`:''}${spent&&earned?' · ':''}${earned?`Income <b style="color:var(--positive)">${fmt(earned)}</b>`:''}</span></div>
    ${list.length ? Object.keys(groups).map(g=>`
      <div class="section-label">${g}</div>
      <div class="list">${groups[g].map(txListRow).join('')}</div>
    `).join('') : (tags.length || txSearch.trim() ? `<div class="empty" style="margin-top:30px;">${icon('search',18)}No matches for these filters<button class="btn small primary" id="tx-reset-all">Reset filters</button></div>`
       : `<div class="empty" style="margin-top:30px;">${icon('other',18)}No transactions yet<button class="btn small primary" data-open-sheet="expense">Add your first transaction</button></div>`)}
  `;

  el.querySelector('#tx-search').oninput = e=>{ txSearch = e.target.value; renderTransactions(); const i = el.querySelector('#tx-search'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
  el.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{ txFilter=b.dataset.filter; saveTxFilters(); renderTransactions(); });
  el.querySelector('#tx-filter-btn').onclick = openHistoryFilters;
  el.querySelectorAll('[data-clear-tag]').forEach(b=>b.onclick=()=>{ txClearTag(b.dataset.clearTag); saveTxFilters(); renderTransactions(); });
  const resetAll = el.querySelector('#tx-reset-all'); if(resetAll) resetAll.onclick = ()=>{ txAdv = {...TXADV_DEFAULT}; txSearch=''; saveTxFilters(); renderTransactions(); };
  wireCommon(el);
}
function openHistoryFilters(){
  const ranges = [['month','This month'],['7d','Last 7 days'],['30d','Last 30 days'],['year','This year'],['all','All time'],['custom','Custom']];
  const sorts = [['new','Newest first'],['old','Oldest first'],['high','Biggest amount'],['low','Smallest amount']];
  let range = txAdv.range;
  openSheet(`
    <h2>Filters</h2>
    <div class="field"><label>Date range</label>
      <div class="range-chips" id="ff-ranges">${ranges.map(([k,l])=>`<button type="button" class="range-chip ${range===k?'active':''}" data-range="${k}">${l}</button>`).join('')}</div>
      <div class="field-row" id="ff-custom" style="display:${range==='custom'?'flex':'none'}">
        <div class="field"><label>From</label><input id="ff-from" type="date" value="${txAdv.from}"></div>
        <div class="field"><label>To</label><input id="ff-to" type="date" value="${txAdv.to}"></div>
      </div>
      <div class="filter-note" style="margin-top:0;">Anything other than This month replaces the month picker.</div>
    </div>
    <div class="field-row">
      <div class="field"><label>Min amount</label><input id="ff-min" type="number" inputmode="decimal" placeholder="Any" value="${txAdv.min}"></div>
      <div class="field"><label>Max amount</label><input id="ff-max" type="number" inputmode="decimal" placeholder="Any" value="${txAdv.max}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Category</label><select id="ff-cat"><option value="">All</option>${DATA.settings.categories.map(c=>`<option value="${c.id}" ${txAdv.category===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Account</label><select id="ff-acct"><option value="">All</option>${DATA.settings.accounts.map(a=>`<option ${txAdv.account===a?'selected':''}>${escapeHtml(a)}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Sort by</label><select id="ff-sort">${sorts.map(([k,l])=>`<option value="${k}" ${txAdv.sort===k?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="sheet-actions"><button class="btn" id="ff-reset">Reset</button><button class="btn primary" id="ff-apply">Apply</button></div>
  `);
  sheetBody.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{
    range = b.dataset.range;
    sheetBody.querySelectorAll('[data-range]').forEach(x=>x.classList.toggle('active', x===b));
    sheetBody.querySelector('#ff-custom').style.display = range==='custom' ? 'flex' : 'none';
  });
  sheetBody.querySelector('#ff-apply').onclick = ()=>{
    const from = sheetBody.querySelector('#ff-from').value, to = sheetBody.querySelector('#ff-to').value;
    txAdv = {
      range: range==='custom' && !from && !to ? 'month' : range,
      from: range==='custom' ? from : '', to: range==='custom' ? to : '',
      min: sheetBody.querySelector('#ff-min').value.trim(), max: sheetBody.querySelector('#ff-max').value.trim(),
      category: sheetBody.querySelector('#ff-cat').value, account: sheetBody.querySelector('#ff-acct').value,
      sort: sheetBody.querySelector('#ff-sort').value,
    };
    saveTxFilters(); closeSheet(); renderTransactions();
  };
  sheetBody.querySelector('#ff-reset').onclick = ()=>{ txAdv = {...TXADV_DEFAULT}; saveTxFilters(); closeSheet(); renderTransactions(); };
}
function txListRow(t){
  if(t.kind==='bill') return billTxRow(t);
  const isIncome = t.kind==='income';
  const label = isIncome ? (t.source||'Income') : (t.merchant||'Expense');
  return `<div class="row-item" data-edit-tx="${t.kind}:${t.id}">
    ${merchantBadge(label,t.kind,t.category,t.icon)}

    <div class="row-actions">
      <button class="icon-btn" data-del="${t.kind==='income'?'income':'expenses'}:${t.id}">${icon('trash',13)}</button>
    </div>
  </div>`;
}
function billTxRow(b){
  const days = daysUntil(b.due_date);

function scheduleLimit(schedule, base, key){ let lim = base; (schedule||[]).slice().sort((a,b)=>a.from.localeCompare(b.from)).forEach(c=>{ if(c.from<=key && typeof c.limit==='number') lim = c.limit; }); return lim; }
function budgetLimitFor(b, key){ const o = (b.overrides||{})[key]; return (o!==undefined && o!==null) ? o : scheduleLimit(b.schedule, b.limit||0, key); }
function budgetHasOverride(b, key){ const o = (b.overrides||{})[key]; return o!==undefined && o!==null; }
function defaultLimitFor(key){ return scheduleLimit(DATA.settings.limit_schedule, DATA.settings.monthly_budget_limit||0, key); }
function limitFor(key){ const o = (DATA.settings.monthly_limit_overrides||{})[key]; return (o!==undefined && o!==null) ? o : defaultLimitFor(key); }
function hasLimitOverride(key){ const o = (DATA.settings.monthly_limit_overrides||{})[key]; return o!==undefined && o!==null; }
function openMonthLimitSheet(){
  const key = monthKey(selMonth), name = `${MONTH_NAMES[selMonth.getMonth()]} ${selMonth.getFullYear()}`;
  const def = defaultLimitFor(key), custom = hasLimitOverride(key);
  openSheet(`<h2>Limit for ${name}</h2>
    <div class="field amount-field"><input id="ml-input" type="number" step="0.01" inputmode="decimal" value="${limitFor(key)}"></div>
    <div class="filter-note" style="margin:-4px 0 14px;">Changes only ${name}. The Settings limit for this month is ${fmt(def)}; other months keep following Settings.</div>
    <div class="sheet-actions">${custom ? `<button class="btn" id="ml-reset">Use default</button>` : `<button class="btn" id="ml-cancel">Cancel</button>`}<button class="btn primary" id="ml-save">Save</button></div>`);
  const store = async(value, msg)=>{
    const ov = {...(DATA.settings.monthly_limit_overrides||{})};
    if(value===null || value===def) delete ov[key]; else ov[key] = value;
    await api('POST','/api/settings',{monthly_limit_overrides: ov});
    closeSheet(); await refresh(); showToast(msg);
  };
  const cancel = sheetBody.querySelector('#ml-cancel'); if(cancel) cancel.onclick = closeSheet;
  const reset = sheetBody.querySelector('#ml-reset'); if(reset) reset.onclick = ()=>store(null, `${name} uses the default limit`);
  sheetBody.querySelector('#ml-save').onclick = ()=>{
    const v = parseFloat(sheetBody.querySelector('#ml-input').value);
    if(isNaN(v) || v<0) return showToast('Enter a limit');
    store(v, `Limit for ${name} updated`);
  };
}

function periodMonths(period){
  const n = period==='month'?1:period==='3m'?3:period==='6m'?6:period==='year'?12:1;

}
const WEEKDAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const WEEKDAYS_LONG = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function paceSvg(cum, dim, lim, upto){
  const W=320, H=150, pl=8, pr=8, pt=16, pb=20, pw=W-pl-pr, ph=H-pt-pb;
  const last = cum[upto-1] || 0;
  const maxY = (Math.max(lim, last) * 1.1) || 1;
  const x = d=> pl + (dim>1 ? (d-1)/(dim-1) : 0)*pw, y = v=> pt + ph - (v/maxY)*ph;
  const pts = []; for(let d=1; d<=upto; d++) pts.push(`${x(d).toFixed(1)},${y(cum[d-1]).toFixed(1)}`);
  const over = lim>0 && last>lim;
  const col = over ? '#FF6673' : '#4C8DFF';
  const area = pts.length ? `<polygon points="${x(1).toFixed(1)},${(pt+ph).toFixed(1)} ${pts.join(' ')} ${x(upto).toFixed(1)},${(pt+ph).toFixed(1)}" fill="${col}" fill-opacity="0.15"/>` : '';
  const ticks = [1, Math.round(dim/4)+1, Math.round(dim/2), Math.round(dim*0.75), dim].filter((v,k,a)=>a.indexOf(v)===k);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:10px;">
    ${lim>0 ? `<line x1="${pl}" y1="${y(lim).toFixed(1)}" x2="${W-pr}" y2="${y(lim).toFixed(1)}" stroke="#FF6673" stroke-opacity="0.6" stroke-dasharray="4 4"/><text x="${W-pr}" y="${(y(lim)-4).toFixed(1)}" text-anchor="end" font-size="9" fill="#FF6673">Limit ${fmt(lim)}</text>
    <line x1="${x(1).toFixed(1)}" y1="${y(lim/dim).toFixed(1)}" x2="${x(dim).toFixed(1)}" y2="${y(lim).toFixed(1)}" stroke="#8B97AA" stroke-opacity="0.7" stroke-dasharray="2 4"/>` : ''}
    ${area}
    ${pts.length ? `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(upto).toFixed(1)}" cy="${y(last).toFixed(1)}" r="4" fill="${col}"/>` : ''}
    ${ticks.map(d=>`<text x="${x(d).toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="9" fill="#8B97AA">${d}</text>`).join('')}
  </svg>`;
}

    </div>

    <div class="card">
      <div class="card-title">Biggest Expenses</div>
      <div class="list" style="margin-top:10px;">${biggest.map(e=>`<div class="row-item" data-edit-tx="expense:${e.id}" style="cursor:pointer;">
        ${merchantBadge(e.merchant||'Expense','expense',e.category,e.icon)}
        <div class="row-body"><div class="row-title">${escapeHtml(e.merchant||'Expense')}</div><div class="row-sub">${shortDate(e.date)} · ${escapeHtml(catById(e.category).name)}</div></div>

    </div>

    <div class="card">
      <div class="card-title">Fixed vs Everyday Spending</div>
      ${totalSpent>0 ? `<div class="split-bar"><div style="width:${fixedTotal/totalSpent*100}%;background:#FFB020"></div><div style="width:${everydayTotal/totalSpent*100}%;background:var(--blue)"></div></div>
      <div class="stat-grid" style="margin-top:12px;">
        <div class="stat"><div class="stat-label"><span style="color:#FFB020">●</span> Fixed (recurring)</div><div class="stat-value">${fmt(fixedTotal)}</div><div class="stat-label">${Math.round(fixedTotal/totalSpent*100)}% of spending</div></div>
        <div class="stat"><div class="stat-label"><span style="color:var(--blue)">●</span> Everyday</div><div class="stat-value">${fmt(everydayTotal)}</div><div class="stat-label">${Math.round(everydayTotal/totalSpent*100)}% of spending</div></div>
      </div>
      ${totalIncome>0 && fixedTotal>0 ? `<div class="chart-note">Fixed costs take ${Math.round(fixedTotal/totalIncome*100)}% of your income.</div>` : ''}` : noSpend}
    </div>

    <div class="card">
      <div class="card-title">Spending by Weekday</div>
      ${wkMax>0 ? `<div class="wk-bars">${wk.map((v,k)=>`<div class="wk-col ${k===wkTop?'top':''}"><div class="wk-val">${v>0 ? fmt(v).replace('.00','') : ''}</div><div class="wk-bar" style="height:${(v/wkMax)*78}%"></div><div class="wk-lab">${WEEKDAYS[k]}</div></div>`).join('')}</div>` : noSpend}
    </div>

    <div class="card">
      <div class="card-title">Recurring Expenses</div>
      <div class="list scroll-box" style="margin-top:10px;">${recurring.length? recurring.map(r=>`
        <div class="trend-row"><span>${escapeHtml(r.merchant||r.name)}</span><span class="row-amt">${fmt(r.amount)}</span></div>
      `).join('') : `<div class="empty">${icon('other',18)}No recurring items marked yet.</div>`}</div>
    </div>
  `;
  el.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{ analyticsPeriod=b.dataset.period; renderAnalytics(); });
  const detail = el.querySelector('#bars-detail');
  const showBar = k=>{
    const d = monthData[k];
    el.querySelectorAll('[data-bar]').forEach(x=>x.classList.toggle('sel', +x.dataset.bar===k));
    detail.innerHTML = `<b style="color:var(--text)">${MONTH_NAMES[d.m.getMonth()]} ${d.m.getFullYear()}</b><span>Income <b style="color:var(--positive)">${fmt(d.inc)}</b></span><span>Spent <b style="color:var(--negative)">${fmt(d.exp)}</b></span><span>Net <b style="color:${d.inc-d.exp-d.sav>=0?'var(--positive)':'var(--negative)'}">${money(d.inc-d.exp-d.sav,true)}</b></span>`;
  };
  el.querySelectorAll('[data-bar]').forEach(x=>x.onclick=()=>showBar(+x.dataset.bar));
  showBar(monthData.length-1);
  wireCommon(el);
}

    wireSimpleSheet(async ()=>{
      const name = sheetBody.querySelector('#cat-name').value.trim();
      if(!name) return;
      await api('POST','/api/categories',{name, color:chosen, icon:'other'});
      closeSheet(); await refresh(); showToast('Category added');
    });
  };
  el.querySelectorAll('[data-del-cat]').forEach(b=>b.onclick=async()=>{ await api('DELETE',`/api/categories/${b.dataset.delCat}`); await refresh(); showToast('Category removed'); });

  el.querySelector('#add-account').onclick = ()=>{
    openSheet(`<h2>Add Account</h2><div class="field"><label>Account name</label><input id="acc-name"></div>
      <div class="sheet-actions"><button class="btn" id="c">Cancel</button><button class="btn primary" id="s2">Save</button></div>`);
    wireSimpleSheet(async ()=>{
      const name = sheetBody.querySelector('#acc-name').value.trim();
      if(!name) return;
      const accounts = [...s.accounts, name];
      await api('POST','/api/settings',{accounts});
      closeSheet(); await refresh(); showToast('Account added');
    });
  };
  el.querySelectorAll('[data-del-acc]').forEach(b=>b.onclick=async()=>{
    const accounts = s.accounts.filter(a=>a!==b.dataset.delAcc);
    await api('POST','/api/settings',{accounts}); await refresh(); showToast('Account removed');
  });

  el.querySelectorAll('[data-notif-key]').forEach(sw=>{
    sw.onclick = async ()=>{
      const turningOn = !sw.classList.contains('on');

        if(!ok) return;
      }
      sw.classList.toggle('on');
      const notifications = Object.assign({bill_reminders:true,budget_warnings:true,savings_goal_updates:true,weekly_summary:true}, s.notifications, {[sw.dataset.notifKey]: turningOn});
      await api('POST','/api/settings',{notifications});
      showToast(turningOn ? 'Notifications enabled' : 'Notifications turned off');
    };
  });

  el.querySelector('#export-data').onclick = ()=>{
    const blob = new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `money-tracker-export-${todayISO()}.json`;
    a.click();
  };
  el.querySelector('#import-data').onclick = ()=>el.querySelector('#import-file').click();

      const parsed = JSON.parse(text);
      await api('POST','/api/import',parsed);
      await refresh(); showToast('Data imported');
    }catch(err){ showToast("Couldn't import this file"); }
  };
}
function wireSimpleSheet(onSave){
  sheetBody.querySelector('#c').onclick = closeSheet;
  sheetBody.querySelector('#s2').onclick = onSave;
}

/* ---------------- add/edit sheets ---------------- */
function categoryOptions(selected){
  return DATA.settings.categories.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${escapeHtml(c.name)}</option>`).join('');
}
function accountOptions(selected){
  return DATA.settings.accounts.map(a=>`<option ${a===selected?'selected':''}>${escapeHtml(a)}</option>`).join('');
}
function openExpenseSheet(existing){
  const e = existing || {amount:'',category:DATA.settings.categories[0].id,account:DATA.settings.accounts[0],date:todayISO(),merchant:'',note:'',recurring:false};
  openSheet(`
    <h2>${existing?'Edit Expense':'Add Expense'}</h2>
    <div class="field amount-field"><input id="f-amount" type="number" step="0.01" inputmode="decimal" placeholder="0.00" value="${e.amount}"></div>
    <div class="field"><label>Category</label><select id="f-category">${categoryOptions(e.category)}</select></div>
    <div class="field-row">
      <div class="field"><label>Account</label><select id="f-account">${accountOptions(e.account)}</select></div>
      <div class="field"><label>Date</label><input id="f-date" type="date" value="${e.date}"></div>
    </div>
    <div class="field"><label>Merchant / Description</label><input id="f-merchant" value="${escapeHtml(e.merchant)}"></div>
    <div class="field"><label>Note — optional</label><textarea id="f-note">${escapeHtml(e.note||'')}</textarea></div>
    <div class="toggle-row"><span class="toggle-label">Recurring</span><button type="button" class="switch ${e.recurring?'on':''}" id="f-recurring"><span class="knob"></span></button></div>
    <div class="field">
      <label>Receipt — optional</label>
      <div id="receipt-row" style="display:flex;align-items:center;gap:10px;">
        ${e.receipt?`<img id="f-receipt-thumb" src="${e.receipt}" style="width:52px;height:52px;object-fit:cover;border-radius:10px;border:1px solid var(--border);cursor:pointer;flex-shrink:0;">
        <button type="button" id="f-receipt-remove" class="icon-btn">${icon('x',12)}</button>`:''}
        <input id="f-file" type="file" accept="image/*" style="flex:1;min-width:0;">
      </div>
    </div>
    ${existing?`<div class="sheet-actions"><button class="btn danger" id="f-delete">Delete</button><button class="btn primary" id="f-save">Save Changes</button></div>`
      :`<button class="btn primary" id="f-save" style="width:100%;padding:16px;margin-top:6px;">Save Expense</button>`}
  `);
  sheetBody.querySelector('#f-recurring').onclick = b=>b.currentTarget.classList.toggle('on');
  let receiptData = e.receipt || null;
  if(receiptData){
    sheetBody.querySelector('#f-receipt-thumb').onclick = ()=> showReceipt(receiptData);
    sheetBody.querySelector('#f-receipt-remove').onclick = ()=>{
      receiptData = null;
      sheetBody.querySelectorAll('#f-receipt-thumb,#f-receipt-remove').forEach(n=>n.remove());
    };
  }
  sheetBody.querySelector('#f-file').onchange = ev=>{
    const file = ev.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ receiptData = reader.result; };
    reader.readAsDataURL(file);
  };
  if(existing) sheetBody.querySelector('#f-delete').onclick = async()=>{ await api('DELETE',`/api/expenses/${e.id}`); closeSheet(); await refresh(); showToast('Expense deleted'); };
  sheetBody.querySelector('#f-save').onclick = async()=>{
    const amount = parseFloat(sheetBody.querySelector('#f-amount').value);
    const merchant = sheetBody.querySelector('#f-merchant').value.trim();
    if(!amount || !merchant) return showToast('Amount and merchant are required');
    const body = {
      amount, merchant,
      category: sheetBody.querySelector('#f-category').value,
      account: sheetBody.querySelector('#f-account').value,
      date: sheetBody.querySelector('#f-date').value,
      note: sheetBody.querySelector('#f-note').value,
      recurring: sheetBody.querySelector('#f-recurring').classList.contains('on'),
      receipt: receiptData,
    };
    if(existing) await api('PUT',`/api/expenses/${e.id}`, body);
    else await api('POST','/api/expenses', body);
    closeSheet(); await refresh(); showToast(existing?'Expense updated':'Expense added'); setTimeout(refresh, 4500); // logo lookup finishes in the background
  };
}

function openBudgetSheet(existing, preset){
  const key = monthKey(selMonth), monthName = `${MONTH_NAMES[selMonth.getMonth()]} ${selMonth.getFullYear()}`;
  const scopeNotes = {
    month: `Changes only ${monthName}. Every other month keeps its own limit.`,
    onward: `Starts in ${monthName} and continues in every later month. Earlier months keep their limits, and months with their own custom limit are not changed.`,
    all: `Sets this limit for every month, past and future, and replaces any custom month limits for this category.`,
  };
  openSheet(`
    <h2>${existing?'Edit Budget':'Create Budget'}</h2>
    ${existing
      ? `<div class="field"><label>Category</label><div style="padding:14px;border-radius:16px;background:var(--input);border:1px solid var(--border);color:var(--text2);">${escapeHtml(catById(existing.category).name)}</div></div>`
      : `<div class="field"><label>Category</label><select id="f-category">${categoryOptions(preset&&preset.category)}</select></div>`}
    <div class="field amount-field"><input id="f-limit" type="number" step="0.01" inputmode="decimal" placeholder="0.00" value="${existing?budgetLimitFor(existing,key):(preset?preset.limit:'')}"></div>
    ${existing ? `<div class="field"><label>Apply to</label>
      <div class="range-chips" id="bs-scope">
        <button type="button" class="range-chip active" data-scope="month">This month only</button>
        <button type="button" class="range-chip" data-scope="onward">This month and after</button>
        <button type="button" class="range-chip" data-scope="all">Every month</button>
      </div>
      <div class="filter-note" id="bs-scope-note" style="margin-top:0;">${scopeNotes.month}</div></div>` : ''}
    ${existing?`<div class="sheet-actions"><button class="btn danger" id="f-delete">Delete</button><button class="btn primary" id="f-save">Save Changes</button></div>`
      :`<button class="btn primary" id="f-save" style="width:100%;padding:16px;margin-top:6px;">Save Budget</button>`}
  `);
  let scope = 'month';
  sheetBody.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{
    scope = b.dataset.scope;
    sheetBody.querySelectorAll('[data-scope]').forEach(x=>x.classList.toggle('active', x===b));
    sheetBody.querySelector('#bs-scope-note').textContent = scopeNotes[scope];
  });
  if(existing) sheetBody.querySelector('#f-delete').onclick = async()=>{ await api('DELETE',`/api/budgets/${existing.id}`); closeSheet(); await refresh(); showToast('Budget deleted'); };
  sheetBody.querySelector('#f-save').onclick = async()=>{
    const limit = parseFloat(sheetBody.querySelector('#f-limit').value);
    if(!limit) return showToast('Enter a limit');
    if(existing){
      let body, msg;
      if(scope==='all'){ body = {limit, schedule:[], overrides:{}}; msg = 'Budget updated for every month'; }
      else if(scope==='month'){
        const ov = {...(existing.overrides||{})};
        if(limit===scheduleLimit(existing.schedule, existing.limit||0, key)) delete ov[key]; else ov[key] = limit;
        body = {overrides: ov}; msg = `Budget updated for ${monthName} only`;
      } else {
        const sched = (existing.schedule||[]).filter(c=>c.from<key);   // this month's and later steps are replaced
        const ov = {...(existing.overrides||{})}; delete ov[key];
        body = {schedule: limit===scheduleLimit(sched, existing.limit||0, key) ? sched : sched.concat([{from:key, limit}]), overrides: ov};
        msg = `Budget updated from ${monthName} onward`;
      }
      await api('PUT',`/api/budgets/${existing.id}`, body);
      closeSheet(); await refresh(); showToast(msg); return;
    }
    await api('POST','/api/budgets',{category: sheetBody.querySelector('#f-category').value, limit});
    closeSheet(); await refresh(); showToast('Budget created');
  };
}

/* ---------------- savings goal detail + monthly-pace projection ---------------- */
function monthsBetween(a, b){
  return Math.max(0, (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()));
}
function projectedCompletion(g){
  const remaining = (g.target||0) - (g.current||0);
  if(remaining <= 0) return {reached:true};
  const basisDateStr = (g.created_at||'').slice(0,10);
  if(!basisDateStr) return null;
  const basisDate = new Date(basisDateStr+'T00:00:00');
  const now = new Date();
  // sir saves in monthly lump sums, not daily — pace is averaged per calendar month, not per day.
  // Always basis off the goal's actual current balance vs. its creation date, not the contribution
  // log alone — the log can be missing the original lump sum or contain only a correction entry,
  // which would otherwise make the pace look negative even though real progress has been made.
  const monthsElapsed = Math.max(1, monthsBetween(basisDate, now));
  const avgMonthly = (g.current||0) / monthsElapsed;
  if(avgMonthly <= 0) return {noProgress:true};
  const monthsRemaining = Math.ceil(remaining/avgMonthly);
  const projDate = new Date(now.getFullYear(), now.getMonth()+monthsRemaining, 1);
  return { monthsRemaining, label: `${MONTH_NAMES[projDate.getMonth()]} ${projDate.getFullYear()}` };
}
function openGoalDetail(goal){
  const g = goal;
  const pct = g.target ? Math.max(0,Math.min(100,Math.round((g.current/g.target)*100))) : 0;
  const proj = projectedCompletion(g);
  const projLine = proj && proj.reached ? 'Goal reached'
    : proj && proj.noProgress ? 'No progress logged yet'
    : proj ? `~${proj.monthsRemaining} month${proj.monthsRemaining!==1?'s':''} to go (est. ${proj.label})`
    : 'Not enough history yet';
  const contributions = [...(g.contributions||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  openSheet(`
    <h2>${escapeHtml(g.name)}</h2>
    <div style="font-size:26px;font-weight:700;margin-bottom:2px;">${fmt(g.current)} <span style="font-size:14px;font-weight:400;color:var(--text2);">of ${fmt(g.target)}</span></div>
    <div class="progress-row"><div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:var(--blue)"></div></div><div class="progress-pct">${pct}%</div></div>
    <div style="display:flex;justify-content:space-between;margin-top:14px;font-size:12px;color:var(--text2);gap:10px;">
      <span>Target date: ${g.target_date ? shortDate(g.target_date) : 'Not set'}</span>
      <span style="text-align:right;">${projLine}</span>
    </div>
    <div class="sheet-actions" style="margin-top:16px;">
      <button class="btn" id="g-remove">Remove funds</button>
      <button class="btn primary" id="g-add">Add funds</button>
    </div>
    <div class="section-label">Contribution history</div>
    <div class="list scroll-box">${contributions.length ? contributions.map(c=>`
      <div class="trend-row"><span>${shortDate(c.date)}</span><span class="row-amt" style="color:${c.amount<0?'var(--negative)':'var(--positive)'}">${c.amount<0?'-':'+'}${fmt(Math.abs(c.amount))}</span></div>
    `).join('') : `<div class="empty">${icon('other',16)}No contributions logged yet.</div>`}</div>
    <div class="sheet-actions" style="margin-top:14px;">
      <button class="btn" id="g-edit">Edit Goal</button>
      <button class="btn danger" id="g-delete">Delete</button>
    </div>
  `);
  sheetBody.querySelector('#g-add').onclick = ()=> openContributeSheet(g.id,'add');
  sheetBody.querySelector('#g-remove').onclick = ()=> openContributeSheet(g.id,'remove');
  sheetBody.querySelector('#g-edit').onclick = ()=> openGoalSheet(g);
  sheetBody.querySelector('#g-delete').onclick = async()=>{ await api('DELETE',`/api/savings_goals/${g.id}`); closeSheet(); await refresh(); showToast('Goal deleted'); };
}

/* ---------------- common event wiring (delegation-lite) ---------------- */
function wireCommon(root){
  root.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{

      if(tab==='budget-goals'){ switchTab('budget'); return; }
      if(el.dataset.filter){ txFilter = el.dataset.filter; }
      switchTab(tab);
    };
  });
  root.querySelectorAll('[data-open-sheet]').forEach(el=>{
    el.onclick = ()=>{
      const key = el.dataset.openSheet;
      if(key==='expense') openExpenseSheet();
      else if(key==='income') openIncomeSheet();
      else if(key==='bill') openBillSheet();
      else if(key==='overall-budget') openMonthLimitSheet();
      else if(key==='goal') openGoalSheet();
      else if(key.startsWith('contribute:')) openContributeSheet(key.split(':')[1]);

  root.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = async e=>{

      const [collection,id] = el.dataset.del.split(':');

  root.querySelectorAll('[data-pay-bill]').forEach(el=>{

  root.querySelectorAll('[data-view-receipt]').forEach(el=>{
    el.onclick = e=>{
      e.stopPropagation();
      const x = DATA.expenses.find(x=>x.id===el.dataset.viewReceipt);
      if(x && x.receipt) showReceipt(x.receipt);
    };
  });
  root.querySelectorAll('[data-edit-budget]').forEach(el=>{
    el.onclick = e=>{
      e.stopPropagation();
      const b = DATA.budgets.find(x=>x.id===el.dataset.editBudget);
      if(b) openBudgetSheet(b);
    };
  });
  root.querySelectorAll('[data-goal-detail]').forEach(el=>{

      e.stopPropagation();
      const g = DATA.savings_goals.find(x=>x.id===el.dataset.goalDetail);

  root.querySelectorAll('[data-cat-row]').forEach(el=>{

        donut.querySelector('#donut-center-label').textContent = t.cat.name;

}
document.getElementById('bell-btn').onclick = ()=>{
  const notifs = buildNotifications();
  openSheet(`
    <h2>Notifications</h2>
    <div class="list">${notifs.length? notifs.map(n=>`<div class="row-item"><span class="icon-circle" style="width:30px;height:30px;background:${hexToRgba('#4C8DFF',.15)}">${icon('other',13,'var(--blue)',2)}</span><div class="row-body"><div class="row-title" style="white-space:normal;">${n}</div></div></div>`).join('')
      : `<div class="empty">${icon('check',20)}You're all caught up.</div>`}</div>
  `);

};
function buildNotifications(){
  const notifs = [];
  upcomingBills().forEach(b=>{
    const d = daysUntil(b.due_date);
    if(d===1) notifs.push(`${escapeHtml(b.name)} is due tomorrow — ${fmt(b.amount)}`);
    else if(d===0) notifs.push(`${escapeHtml(b.name)} is due today — ${fmt(b.amount)}`);
  });
  DATA.budgets.forEach(b=>{
    const spent = sum(monthExpenses().filter(e=>e.category===b.category));
    const lim = budgetLimitFor(b, monthKey(selMonth)), pct = lim? (spent/lim)*100:0;
    if(pct>=80) notifs.push(`You've used ${Math.round(pct)}% of your ${catById(b.category).name} budget`);
  });
  DATA.savings_goals.forEach(g=>{
    const pct = g.target? Math.round((g.current/g.target)*100):0;
    if(pct>=50) notifs.push(`Your ${escapeHtml(g.name)} goal reached ${pct}%`);
  });
  return notifs;
}

/* ---------------- push notifications ---------------- */
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function ensurePushSubscribed(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    showToast('Push notifications are not supported on this browser');
    return false;
  }
  const reg = await navigator.serviceWorker.register('sw-disabled.js');
  await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub){
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ showToast('Notification permission was not granted'); return false; }
    const keyRes = await fetch('/vapid-public-key');
    const { key } = await keyRes.json();
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(key) });
  }
  await api('POST','/api/push/subscribe', sub.toJSON());
  return true;
}

        ${icon(CAT_ICON[c.icon]||'other',26,c.color)}<span>${escapeHtml(c.name)}</span></button>`).join('')}
    </div>
    <button class="btn" id="pick-skip" style="width:100%;margin-top:12px;color:var(--text2);">Keep as Other for now</button>
  `);
  const done = async(body, msg)=>{
    await api('POST',`/api/expenses/${e.id}/categorize`, body);

    if((DATA.expenses||[]).some(x=>x.pending_category)) setTimeout(()=>openCategorizePicker(), 400);
  };
  sheetBody.querySelectorAll('[data-pick-cat]').forEach(b=>b.onclick=()=>done({category:b.dataset.pickCat}, `Saved under ${catById(b.dataset.pickCat).name}`));
  sheetBody.querySelector('#pick-skip').onclick=()=>done({skip:true}, 'Kept under Other');
}
function maybeOpenCategorizePicker(expId){
  if(VIEW_ONLY_COPY || backdrop.classList.contains('open')) return;
  if((DATA.expenses||[]).some(x=>x.pending_category)) openCategorizePicker(expId);
}
document.addEventListener('visibilitychange', async()=>{
  if(document.visibilityState!=='visible' || VIEW_ONLY_COPY) return;
  await loadData(); maybeOpenCategorizePicker();
});

/* ---------------- init ---------------- */
(async function init(){
  await loadData();
  renderHeader();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw-disabled.js').catch(()=>{});
  const params = new URLSearchParams(location.search);
  const qtab = params.get('tab');
  if(qtab && document.getElementById('view-'+qtab)) switchTab(qtab); else renderCurrentTab();
  maybeOpenCategorizePicker(params.get('categorize'));
  if(params.get('categorize')) history.replaceState(null,'',location.pathname);
})();
